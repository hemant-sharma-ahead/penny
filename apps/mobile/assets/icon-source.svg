<!--
  Penny app icon — "Golden Dawn" (Ref 2 over Golden Dawn horizon), approved via
  docs/mockups/proposals/app-icon-v8.html (2026-08-05), option 6 — supersedes the earlier
  "Leaf Medallion Coin Stack" (app-icon-v1.html, 2026-08-04). A gold coin, struck with the
  original web-react sprout mark, cresting a dawn horizon — a coin already looks like a
  small rising sun, so the sprout's own two blades read as its rays without needing literal
  sun-ray lines. Canonical vector master for icon.png, favicon.png, splash-icon.png, and
  the Android adaptive-icon layers (android-icon-foreground/background/monochrome.png) —
  those are all derived renders/crops of this same composition, not independent designs.
  The foreground/background/monochrome split variants used for the Android adaptive icon
  are not checked in separately — see the git history of this file's regeneration commit,
  or docs/mockups/proposals/app-icon-v8.html for how to reconstruct them:
    - foreground: this file's coin+sprout+horizon group, minus the sky <rect>, transparent bg
    - background: just the sky <linearGradient> <rect>, no coin/sprout/horizon
    - monochrome: a <mask>-based white silhouette of the coin+horizon with the stem/leaf
      shapes knocked out as transparent negative space (Android themed-icon spec requires a
      single-color/alpha-only layer — the OS applies its own tint)
  To regenerate a PNG at a new size: render this file (or the variants above) with any SVG
  rasterizer (e.g. `rsvg-convert -w SIZE -h SIZE icon-source.svg -o out.png`) at the target
  pixel size.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08281f"/>
      <stop offset="55%" stop-color="#0d6b4a"/>
      <stop offset="85%" stop-color="#e79a3f"/>
      <stop offset="100%" stop-color="#fbcb6b"/>
    </linearGradient>
    <radialGradient id="gold" cx="35%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#ffefc2"/>
      <stop offset="30%" stop-color="#f6c74b"/>
      <stop offset="62%" stop-color="#d89b2b"/>
      <stop offset="100%" stop-color="#8a5a12"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <g transform="translate(0,44)">
    <circle cx="256" cy="256" r="200" fill="url(#gold)"/>
    <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(74,42,6,0.5)" stroke-width="11" stroke-dasharray="3 8"/>
    <circle cx="256" cy="256" r="172" fill="none" stroke="rgba(255,244,214,0.55)" stroke-width="4"/>
    <path d="M120 196 A172 172 0 0 1 196 120" stroke="rgba(255,255,255,0.7)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M256 368V224" stroke="#6b430d" stroke-width="26" stroke-linecap="round"/>
    <path d="M256 288 C216 272 168 240 184 176 C200 112 256 152 256 232" fill="#fff8ec" opacity="0.95"/>
    <path d="M256 256 C296 240 344 208 328 144 C312 80 256 120 256 200" fill="#fff8ec"/>
  </g>
  <path d="M0 372 Q256 328 512 372 L512 512 L0 512 Z" fill="#04241a"/>
</svg>
